// Selección de 3 mejoras (las ya obtenidas tienen más probabilidad)
function pickChoices(n) {
  const pool = UPGRADES.filter((u) => upLvl(u.id) < u.max);
  const out = [];
  while (out.length < n && pool.length > 0) {
    let total = 0;
    for (let i = 0; i < pool.length; i++) total += upLvl(pool[i].id) > 0 ? 1.4 : 1;
    let r = Math.random() * total;
    let idx = 0;
    for (let i = 0; i < pool.length; i++) {
      r -= upLvl(pool[i].id) > 0 ? 1.4 : 1;
      if (r <= 0) { idx = i; break; }
    }
    out.push(pool[idx]);
    pool.splice(idx, 1);
  }
  return out;
}

function openLevelUp() {
  state.mode = 'levelup';
  state.choices = pickChoices(3);
  ui.cardWrap.innerHTML = '';
  state.choices.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--cc', hexOf(u.col));
    card.style.animationDelay = (i * 0.08) + 's';
    const lv = upLvl(u.id);
    card.innerHTML =
      '<div class="icon">' + u.icon + '</div>' +
      '<div class="name">' + u.name + '</div>' +
      '<div class="lvl">' + (lv === 0 ? 'NUEVO' : 'NIVEL ' + lv + ' → ' + (lv + 1)) + '</div>' +
      '<div class="desc">' + u.desc + '</div>';
    card.addEventListener('click', () => chooseUpgrade(i));
    ui.cardWrap.appendChild(card);
  });
  ui.lvlUpNum.textContent = String(state.level);
  state.lvlAutoT = 12;
  input.tmx = 0; input.tmz = 0; input.aimOn = false;
  ui.stickMove.style.display = 'none';
  ui.stickAim.style.display = 'none';
  Audio3D.levelUp();
  showScreen('levelup');
}

function applyUpgrade(u) {
  state.upgrades[u.id] = upLvl(u.id) + 1;
  if (u.id === 'vida') {
    state.maxHp += 10;
    state.hp = Math.min(state.maxHp, state.hp + 35);
  }
  if (u.id === 'vortex') state.vortexT = 0.6;
  Audio3D.chime(Math.min(7, state.level), 0.2);
  halo(player.x, 0.9, player.z, u.col, 7, 0.5, 0.8);
  burst(player.x, 0.9, player.z, u.col, 30, 16, 0.6, 0.28);
  addRipple(player.x, player.z, 1.2);
  state.shakeAmt = Math.min(2, state.shakeAmt + 0.4);
  floatText(u.name, player.x, 3.2, player.z, hexOf(u.col), 0.9, { bounce: 1 });
}

function chooseUpgrade(i) {
  const u = state.choices[i];
  if (!u || state.mode !== 'levelup') return;
  applyUpgrade(u);
  state.pendingLevels = Math.max(0, state.pendingLevels - 1);
  if (state.pendingLevels > 0) {
    openLevelUp();
  } else {
    state.mode = 'play';
    showScreen(null);
  }
}

/* HUD: solo escribe en el DOM cuando el valor cambia */
const hudCache = {};
function setTxt(key, node, v) {
  if (hudCache[key] !== v) { hudCache[key] = v; node.textContent = v; }
}
function setScale(key, node, v) {
  v = clamp(v, 0, 1);
  if (hudCache[key] !== v) { hudCache[key] = v; node.style.transform = 'scaleX(' + v.toFixed(3) + ')'; }
}
function updateHUD() {
  setScale('hp', ui.hpFill, state.hp / state.maxHp);
  setTxt('hpT', ui.hpText, Math.ceil(state.hp) + ' / ' + state.maxHp);
  setScale('xp', ui.xpFill, state.xp / state.xpNeed);
  setTxt('xpT', ui.xpText, state.xp + ' / ' + state.xpNeed);
  setScale('dash', ui.dashFill, 1 - state.dashCd / CFG.dashCooldown);
  ui.dashBtn.classList.toggle('cooldown', state.dashCd > 0);
  setTxt('score', ui.scoreVal, String(state.score));
  setTxt('wave', ui.waveVal, String(state.wave));
  setTxt('lvl', ui.lvlVal, 'LV ' + state.level);
  setTxt('combo', ui.comboVal, 'x' + state.comboMult + (state.combo > 0 ? ' · ' + state.combo : ''));
  let boss = null;
  for (let i = 0; i < enemies.length; i++) {
    const g = enemies[i];
    if (g.userData.kind === 4 && !g.userData.dead) { boss = g; break; }
  }
  if (boss) {
    ui.bossBar.style.display = 'flex';
    ui.bossName.style.display = 'block';
    setTxt('bossN', ui.bossName, '⚠ JEFE ' + (state.bossesKilled + 1) + ' ⚠');
    setScale('boss', ui.bossFill, boss.userData.hp / boss.userData.maxHp);
  } else {
    ui.bossBar.style.display = 'none';
    ui.bossName.style.display = 'none';
  }
  const hudOn = state.mode !== 'menu' && state.mode !== 'how';
  ui.hud.style.opacity = hudOn ? '1' : '0';
  const lowHp = state.hp / state.maxHp < 0.3 && (state.mode === 'play' || state.mode === 'dying');
  const vig = Math.max(state.hurtAlpha * 0.9, lowHp ? 0.22 + 0.14 * Math.sin(state.realTime * 8) : 0);
  ui.vignette.style.opacity = String(clamp(vig, 0, 1));
  ui.flash.style.opacity = String(clamp(state.flashAlpha, 0, 1));
}

/* ====================================================================
   12. ENTRADA: teclado, ratón (apuntado) y táctil (joysticks + DASH)
   ==================================================================== */
const keys = { up: false, down: false, left: false, right: false };
const KEYMAP = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right'
};

function readInput(rdt) {
  let kx = 0, kz = 0;
  if (keys.left) kx -= 1;
  if (keys.right) kx += 1;
  if (keys.up) kz -= 1;
  if (keys.down) kz += 1;
  let mx = input.tmx, mz = input.tmz;
  if (mx === 0 && mz === 0) { mx = kx; mz = kz; }
  const l = Math.sqrt(mx * mx + mz * mz);
  if (l > 1) { mx /= l; mz /= l; }
  input.mx = mx;
  input.mz = mz;
  if (input.mouseAim) {
    input.mouseT -= rdt;
    if (input.mouseT <= 0) input.mouseAim = false;
  }
}

window.addEventListener('keydown', (e) => {
  Audio3D.init();
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    if (state.mode === 'play') tryDash();
    else if (state.mode === 'menu' || state.mode === 'over') startRun();
    return;
  }
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (state.mode === 'levelup') {
    if (e.code === 'Digit1') chooseUpgrade(0);
    if (e.code === 'Digit2') chooseUpgrade(1);
    if (e.code === 'Digit3') chooseUpgrade(2);
  }
});
window.addEventListener('keyup', (e) => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state.mode === 'play') togglePause();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.mode === 'play') togglePause();
});

const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9);
const ndc = new THREE.Vector2();
const hitPt = new THREE.Vector3();
function screenToGround(cx, cy) {
  ndc.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(groundPlane, hitPt);
}

const touchSt = { move: null, aim: null };
const STICK_R = 64;
let lastTapT = 0, lastTapX = 0, lastTapY = 0;

function placeStick(node, x, y) {
  node.style.left = x + 'px';
  node.style.top = y + 'px';
  node.style.display = 'block';
  setKnob(node, 0, 0);
}
function setKnob(node, x, y) {
  node.firstElementChild.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
}
function registerTap(x, y) {
  const now = performance.now();
  if (now - lastTapT < 260 && Math.hypot(x - lastTapX, y - lastTapY) < 70) {
    tryDash();
    lastTapT = 0;
  } else {
    lastTapT = now;
    lastTapX = x;
    lastTapY = y;
  }
}
function moveStick(e, st, node, kind) {
  const dx = e.clientX - st.ox, dy = e.clientY - st.oy;
  const l = Math.hypot(dx, dy);
  const nx = l > 0 ? dx / l : 0, ny = l > 0 ? dy / l : 0;
  const c = Math.min(l, STICK_R);
  setKnob(node, nx * c, ny * c);
  const mag = Math.min(1, l / STICK_R);
  if (kind === 'move') {
    input.tmx = mag < 0.12 ? 0 : nx * mag;
    input.tmz = mag < 0.12 ? 0 : ny * mag;
  } else if (mag > 0.2) {
    input.aimX = nx;
    input.aimZ = ny;
  }
}

window.addEventListener('pointerdown', (e) => {
  Audio3D.init();
  if (e.pointerType === 'mouse') {
    if (e.button === 2 && state.mode === 'play') tryDash();
    return;
  }
  const dashEl = e.target && e.target.closest ? e.target.closest('.dash-btn') : null;
  if (dashEl) {
    if (state.mode === 'play') { tryDash(); dashEl.classList.add('pressed'); }
    return;
  }
  if (e.target && e.target.closest && e.target.closest('.pause-btn')) { togglePause(); return; }
  if (e.target && e.target.closest && e.target.closest('.btn, .card')) return;
  if (state.mode !== 'play') return;
  registerTap(e.clientX, e.clientY);
  if (e.clientX < window.innerWidth * 0.5) {
    if (!touchSt.move) {
      touchSt.move = { id: e.pointerId, ox: e.clientX, oy: e.clientY };
      placeStick(ui.stickMove, e.clientX, e.clientY);
    }
  } else if (!touchSt.aim) {
    touchSt.aim = { id: e.pointerId, ox: e.clientX, oy: e.clientY };
    input.aimX = 0; input.aimZ = -1;
    input.aimOn = true;
    placeStick(ui.stickAim, e.clientX, e.clientY);
  }
});

window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') {
    if (state.mode === 'play' && screenToGround(e.clientX, e.clientY)) {
      input.mouseX = hitPt.x;
      input.mouseZ = hitPt.z;
      input.mouseAim = true;
      input.mouseT = 2;
    }
    return;
  }
  if (touchSt.move && e.pointerId === touchSt.move.id) moveStick(e, touchSt.move, ui.stickMove, 'move');
  if (touchSt.aim && e.pointerId === touchSt.aim.id) moveStick(e, touchSt.aim, ui.stickAim, 'aim');
});

function endPointer(e) {
  if (touchSt.move && e.pointerId === touchSt.move.id) {
    touchSt.move = null;
    input.tmx = 0; input.tmz = 0;
    ui.stickMove.style.display = 'none';
  }
  if (touchSt.aim && e.pointerId === touchSt.aim.id) {
    touchSt.aim = null;
    input.aimOn = false;
    ui.stickAim.style.display = 'none';
  }
  ui.dashBtn.classList.remove('pressed');
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

/* Botones de pantalla */
$('btnPlay').addEventListener('click', () => startRun());
$('btnRetry').addEventListener('click', () => startRun());
$('btnHow').addEventListener('click', () => { state.mode = 'how'; showScreen('how'); });
$('btnHowBack').addEventListener('click', () => toMenu());
$('btnResume').addEventListener('click', () => togglePause());
$('btnQuit').addEventListener('click', () => toMenu());
$('btnMenu').addEventListener('click', () => toMenu());
/* ====================================================================
   13. CÁMARA, DEFORMACIÓN DE LA REJILLA Y TEXTOS 3D EN PANTALLA
   ==================================================================== */
const camBase = new THREE.Vector3(0, 26, 18);
const camDesired = new THREE.Vector3();
const camLook = new THREE.Vector3(0, 0, 0);
const projV = new THREE.Vector3();
let menuOrbit = 0;
let lastBT = false;
let gridTime = 0;
let gridDirty = false;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function updateCamera(rdt) {
  const portrait = camera.aspect < 0.9;
  const zoom = portrait ? 1.6 : 1.0;
  const follow = state.mode !== 'menu' && state.mode !== 'how' && state.mode !== 'over';
  let tx = 0, tz = 0;
  if (follow) {
    tx = player.x * 0.55 + player.vx * 0.22;
    tz = player.z * 0.55 + player.vz * 0.22;
  } else {
    menuOrbit += rdt * 0.12;
  }
  const k = expDamp(follow ? 6 : 1.2, rdt);
  camLook.x = lerp(camLook.x, tx, k);
  camLook.z = lerp(camLook.z, tz, k);
  const dist = 18 * zoom;
  const offX = follow ? 0 : Math.sin(menuOrbit) * dist;
  const offZ = follow ? dist : Math.cos(menuOrbit) * dist;
  camDesired.set(camLook.x + offX, 26 * zoom, camLook.z + offZ);
  camBase.lerp(camDesired, k);

  // Sacudida en los 3 ejes proporcional a la fuerza de las explosiones
  const sh = state.shakeAmt * CFG.shake;
  const sx = rand(-1, 1) * sh * 0.9;
  const sy = rand(-1, 1) * sh * 0.6;
  const sz = rand(-1, 1) * sh * 0.9;
  camera.position.set(camBase.x + sx, camBase.y + sy, camBase.z + sz);
  camera.lookAt(camLook.x + sx * 0.4, 0, camLook.z + sz * 0.4);
  // Inclinación dinámica según velocidad y giro de cámara al sacudir
  const lean = follow ? -player.vx * 0.004 : 0;
  camera.rotation.z += lean + rand(-1, 1) * sh * 0.012;

  const baseFov = portrait ? 62 : 52;
  const targetFov = baseFov + state.fovKick * 6 - (state.bulletTimeLeft > 0 ? 4 : 0);
  if (Math.abs(camera.fov - targetFov) > 0.01) {
    camera.fov = lerp(camera.fov, targetFov, expDamp(6, rdt));
    camera.updateProjectionMatrix();
  }
  camera.updateMatrixWorld(true);
}

// Ondas en la rejilla: deformación de malla por impactos (CPU, sobre la posición base)
function updateRipples(rdt) {
  for (let i = RIPPLES.length - 1; i >= 0; i--) {
    const r = RIPPLES[i];
    r.t += rdt;
    if (r.t >= r.life) RIPPLES.splice(i, 1);
  }
  if (RIPPLES.length === 0 && !gridDirty) return;
  const n = gridPosAttr.count;
  const arr = gridPosAttr.array;
  for (let v = 0; v < n; v++) {
    const bx = gridBasePos[v * 3], bz = gridBasePos[v * 3 + 2];
    let y = 0;
    for (let i = 0; i < RIPPLES.length; i++) {
      const r = RIPPLES[i];
      const dx = bx - r.x, dz = bz - r.z;
      const off = Math.sqrt(dx * dx + dz * dz) - r.t * 16;
      if (off > -7 && off < 1) {
        const fall = Math.exp(-Math.abs(off) * 0.35);
        const life = 1 - r.t / r.life;
        y += Math.sin(off * 1.1) * fall * r.strength * life * 0.8;
      }
    }
    arr[v * 3 + 1] = y;
  }
  gridPosAttr.needsUpdate = true;
  gridDirty = RIPPLES.length > 0;
}

function updateHalos(dt) {
  const items = haloPool.items;
  for (let i = 0; i < items.length; i++) {
    const h = items[i];
    const hu = h.userData;
    if (!hu.alive) continue;
    hu.life -= dt;
    if (hu.life <= 0) { haloPool.release(h); continue; }
    const t = hu.life / hu.maxLife;
    h.material.opacity = hu.startA * t;
    const s = hu.size * (1.25 - 0.25 * t);
    h.scale.set(s, s, 1);
  }
}

// Proyecta cada texto 3D a coordenadas de pantalla y aplica rebote al aparecer
function updateTexts(dt) {
  const w = window.innerWidth, h = window.innerHeight;
  for (let i = 0; i < textPool.length; i++) {
    const t = textPool[i];
    if (!t.alive) continue;
    t.life -= dt;
    if (t.life <= 0) { t.alive = false; t.el.style.display = 'none'; continue; }
    t.y += t.vy * dt;
    t.vy *= Math.exp(-2.4 * dt);
    const age = t.maxLife - t.life;
    const k = t.life / t.maxLife;
    projV.set(t.x, t.y, t.z).project(camera);
    if (projV.z > 1) { t.el.style.display = 'none'; continue; }
    const sx = (projV.x * 0.5 + 0.5) * w;
    const sy = (-projV.y * 0.5 + 0.5) * h;
    const pop = t.bounce && age < 0.12 ? 1.55 - (age / 0.12) * 0.55 : 1;
    t.el.style.display = 'block';
    t.el.style.opacity = String(Math.min(1, k * 2.2));
    t.el.style.transform = 'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px) translate(-50%,-50%) scale(' + (t.scale * pop).toFixed(3) + ')';
  }
}

function onNewWave() {
  Audio3D.chime(Math.min(7, state.wave), 0.14);
  floatText('OLEADA ' + state.wave, 0, 4.5, 0, '#fff03a', 1.5, { bounce: 1 });
  state.shakeAmt = Math.min(2, state.shakeAmt + 0.5);
}

function updateMusic(rdt) {
  const inten = clamp(state.wave / 12 + Math.min(1, state.combo / 25) * 0.6, 0, 1);
  Audio3D.setMusicDuck(state.bulletTimeLeft > 0 ? 0.35 : 1);
  Audio3D.musicTick(rdt, inten);
}

/* ====================================================================
   14. BUCLE PRINCIPAL (60 FPS): hit-stop, bullet time y orden de sistemas
   ==================================================================== */
// Devuelve dt del juego (escalado por bullet time y pausado por hit-stop)
function update(rdt) {
  state.realTime += rdt;
  gridTime += rdt;
  state.shakeAmt = Math.max(0, state.shakeAmt - rdt * 2.4);
  state.flashAlpha = Math.max(0, state.flashAlpha - rdt * 2.5);
  state.hurtAlpha = Math.max(0, state.hurtAlpha - rdt * 2.4);
  state.fovKick = Math.max(0, state.fovKick - rdt * 3);
  readInput(rdt);

  const bt = state.bulletTimeLeft > 0;
  let dt = 0;
  const live = state.mode === 'play' || state.mode === 'dying';
  if (live) {
    if (bt) state.bulletTimeLeft -= rdt;
    if (state.bulletTimeCd > 0) state.bulletTimeCd -= rdt;
    state.timeScale = lerp(state.timeScale, bt ? CFG.bulletTimeScale : 1, expDamp(bt ? 14 : 4, rdt));
    if (bt !== lastBT) { lastBT = bt; Audio3D.setBulletTime(bt); }
    if (state.hitstop > 0) state.hitstop -= rdt;
    else dt = rdt * state.timeScale;
  }

  if (state.mode === 'play') {
    state.time += dt;
    if (!state.bossAlive) state.bossTimer += dt;
    const wave = 1 + Math.floor(state.time / CFG.waveInterval);
    if (wave !== state.wave) { state.wave = wave; onNewWave(); }
    if (state.combo > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) { state.combo = 0; state.comboMult = 1; }
    }
    if (state.dashCd > 0) state.dashCd -= dt;
    if (state.invuln > 0) state.invuln -= dt;
    updatePlayer(dt);
    autoFire(dt);
    updatePlayerBullets(dt);
    updateEnemyBullets(dt);
    updateSpecials(dt);
    updateSpawner(dt);
    updateEnemies(dt, rdt);
    updateGems(dt, player.x, player.z);
    updateArcs(dt);
    updateMusic(rdt);
    if (state.pendingLevels > 0) openLevelUp();
  } else if (state.mode === 'dying') {
    updatePlayerDeath();
    updateEnemies(0, rdt);
    state.overT -= rdt;
    if (state.overT <= 0) finishRun();
  } else if (state.mode === 'levelup') {
    state.lvlAutoT -= rdt;
    ui.lvlTimer.style.transform = 'scaleX(' + clamp(state.lvlAutoT / 12, 0, 1).toFixed(3) + ')';
    if (state.lvlAutoT <= 0) chooseUpgrade(randInt(0, state.choices.length - 1));
  }

  updateParticles(dt);
  updateHalos(dt);
  updateRipples(rdt);
  gridMat.uniforms.uTime.value = gridTime;
  gridMat.uniforms.uPulse.value = clamp(state.shakeAmt * 0.25 + state.flashAlpha * 0.5, 0, 1);
  for (let i = 0; i < barrierSides.length; i++) {
    barrierSides[i].mesh.material.opacity = 0.4 + 0.15 * Math.sin(state.realTime * 2.5 + i * 1.6) + state.shakeAmt * 0.05;
  }
  updateHUD();
  return dt;
}

// Durante la muerte: el ship desaparece tras la explosión
function updatePlayerDeath() {
  player.shipGroup.visible = false;
}

function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastNow) / 1000;
  lastNow = now;
  if (!(rdt > 0)) rdt = 1 / 60;
  rdt = Math.min(rdt, 0.05);
  const dt = update(rdt);
  updateCamera(rdt);
  updateTexts(dt);
  renderer.render(scene, camera);
}
let lastNow = performance.now();

/* Estado inicial y arranque */
document.addEventListener('gestureend', (e) => e.preventDefault());
Object.assign(state, makeRunState());
state.mode = 'menu';
resize();
toMenu();
requestAnimationFrame(frame);

})();
</script>
</body>
